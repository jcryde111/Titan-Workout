rip Press",3,"8-12","3-1-1-1","75 sec","Triceps/chest","Elbows 30-45 degrees."],["Cable Fly",3,"12-15","3-1-1-1","60 sec","Chest isolation","Big stretch; hug motion."],["Pullover",3,"10-15","3-1-1-1","60 sec","Lats/serratus","Ribs down; stretch lats."],["Rear Delt Raise",3,"12-20","3-1-1-1","45 sec","Rear delts","Small controlled movement."],["Plank",3,"30-60 sec","Hold","45 sec","Core","Hard brace; glutes on."]],"Lower Body 2":[["Front Squat",3,"6-10","3-1-1-1","120 sec","Quad strength","Upright torso; full depth."],["Full Squat",3,"8-12","3-1-1-1","120 sec","Compound legs","Go lighter if depth is lost."],["Front-Foot Elevated Split Squat",3,"8-12/side","3-1-1-1","90 sec","Unilateral legs","Knee forward; control depth."],["Sissy Squat",3,"10-15","3-1-1-1","75 sec","Quad isolation","Keep tension; use assistance."],["Leg Extension",3,"12-20","3-1-1-1","60 sec","Quad isolation","Pause squeeze at top."],["Seated/Lying Hamstring Curl",3,"10-15","3-1-1-1","75 sec","Hamstrings","Control every rep."],["Standing Calf Raise",4,"10-15","3-1-1-2","45 sec","Calves","Full stretch and squeeze."],["Suitcase Carry",3,"30-60 sec/side","Walk","60 sec","Loaded carry","Tall posture; don't lean."]]};
let PROGRAM=loadProgram();
function cloneProgram(value){return JSON.parse(JSON.stringify(value))}
function loadProgram(){try{let saved=JSON.parse(localStorage.getItem('titanCustomProgram')||'null');return saved&&typeof saved==='object'?saved:cloneProgram(DEFAULT_PROGRAM)}catch{return cloneProgram(DEFAULT_PROGRAM)}}
function saveProgram(){localStorage.setItem('titanCustomProgram',JSON.stringify(PROGRAM));setStatus('Program changes saved on this device')}
function refreshWorkoutSelect(){let select=$('workoutSelect'),previous=active;select.innerHTML='';Object.keys(PROGRAM).forEach(w=>{let o=document.createElement('option');o.value=w;o.textContent=w;select.appendChild(o)});if(!PROGRAM[previous])previous=Object.keys(PROGRAM)[0];active=previous;select.value=active;localStorage.setItem('activeWorkout',active)}
function duplicateWorkout(){let source=active,name=prompt('Name the duplicated workout:',source+' Copy');if(!name)return;name=name.trim();if(!name)return;if(PROGRAM[name]){alert('A workout with that name already exists.');return}PROGRAM[name]=cloneProgram(PROGRAM[source]);saveProgram();active=name;refreshWorkoutSelect();currentSessionId=null;localStorage.removeItem('currentSessionId');render();alert('Workout duplicated. You can now customize it.')}
function editExerciseTarget(index){let ex=PROGRAM[active]?.[index];if(!ex)return;let sets=prompt('Target sets:',String(ex[1]));if(sets===null)return;sets=Number(sets);if(!Number.isInteger(sets)||sets<1||sets>20){alert('Sets must be a whole number from 1 to 20.');return}let reps=prompt('Target reps or range (example: 8-12):',String(ex[2]));if(reps===null||!reps.trim())return;let rest=prompt('Rest period (example: 90 sec):',String(ex[4]));if(rest===null||!rest.trim())return;ex[1]=sets;ex[2]=reps.trim();ex[4]=rest.trim();saveProgram();render()}
function substituteExercise(index){let ex=PROGRAM[active]?.[index];if(!ex)return;let s=currentSession(),hasLogs=s&&logs.some(l=>l.sessionId===s.id&&l.exercise===ex[0]);if(hasLogs&&!confirm('This exercise already has logged sets in the current workout. Existing logs remain under the old exercise name. Continue?'))return;let choices=Object.keys(EXLIB).filter(n=>n!==ex[0]).sort();let name=prompt('Enter the replacement exercise name. Examples: '+choices.slice(0,15).join(', '),ex[0]);if(name===null)return;name=name.trim();if(!name)return;if(!EXLIB[name]){if(!confirm('This exercise is not yet in Titan’s video library. Add it anyway?'))return;makeExerciseInfo(name,['Custom exercise'],['Set up carefully and use a controlled range of motion.'],['Using momentum.','Losing position as fatigue builds.'],['Keep 1–2 reps in reserve while learning the movement.'])}ex[0]=name;saveProgram();render()}
function moveExercise(index,direction){let arr=PROGRAM[active],next=index+direction;if(!arr||next<0||next>=arr.length)return;[arr[index],arr[next]]=[arr[next],arr[index]];saveProgram();render()}
function restoreWorkoutDefaults(){if(!DEFAULT_PROGRAM[active]){if(!confirm('Delete this custom workout?'))return;delete PROGRAM[active];active=Object.keys(PROGRAM)[0];saveProgram();refreshWorkoutSelect();render();return}if(!confirm('Restore '+active+' to the original Titan plan?'))return;PROGRAM[active]=cloneProgram(DEFAULT_PROGRAM[active]);saveProgram();render()}
const EXLIB={};

  'Full Squat':{videoId:'6ZylBkABtC4',source:'Renaissance Periodization',title:'Squat Accessory Exercises Ranked'},
  'Incline Press':{videoId:'eQ_NBB6OBH4',source:'Jeremy Ethier',title:'Upper Chest Training'},

};

function makeExerciseInfo(name, muscles, setup, mistakes, tips){let v=VIDEO_MAP[name]||{};EXLIB[name]={muscles,setup,mistakes,tips,videoSearch:encodeURIComponent(name+' hypertrophy proper form tutorial'),videoId:v.videoId||'',videoSource:v.source||'',videoTitle:v.title||''}}
[['Push Press','Shoulders, triceps, legs, core'],['Spider Curl','Biceps'],['Incline Triceps Extension','Triceps'],['Lateral Raise','Side delts'],['Rear Delt Row','Rear delts, upper back'],['Reverse Crunch','Abs'],['Rope Curl','Biceps, brachialis'],['Triceps Rope Extension','Triceps'],['Bird Dog','Core, glutes, back'],['Hip Thrust','Glutes, hamstrings'],['Sumo Deadlift','Glutes, hamstrings, back'],['Lying Leg Curl','Hamstrings'],['Single-Leg Hip Thrust','Glutes, core'],['Good Morning','Hamstrings, glutes, spinal erectors'],['Hip Abduction','Glute medius'],['Calf Raise','Calves'],['Dead Bug','Core'],['Incline Press','Chest, shoulders, triceps'],['Reverse-Grip Row','Lats, biceps, mid-back'],['Decline Press','Chest, triceps'],['Chin-Up / Assisted Chin-Up','Lats, biceps'],['Close-Grip Press','Triceps, chest'],['Cable Fly','Chest'],['Pullover','Lats, serratus'],['Rear Delt Raise','Rear delts'],['Plank','Core'],['Front Squat','Quads, core, upper back'],['Full Squat','Quads, glutes, hamstrings'],['Front-Foot Elevated Split Squat','Quads, glutes'],['Sissy Squat','Quads'],['Leg Extension','Quads'],['Seated/Lying Hamstring Curl','Hamstrings'],['Standing Calf Raise','Calves'],['Suitcase Carry','Core, grip, traps']].forEach(([n,m])=>makeExerciseInfo(n,m.split(', '),['Set up slowly and brace before the first rep.','Use a controlled range of motion that you can repeat cleanly.','Keep the working muscle under tension through the target tempo.'],['Rushing the eccentric portion.','Using momentum to finish reps.','Sacrificing position to add weight.'],['Stop 1-2 reps before form breaks.','Log weight and reps immediately after the set.','Use the YouTube button if you want a deeper form review.']));
const $=id=>document.getElementById(id), DB_NAME='TitanWorkoutV5', DB_VERSION=1;
let db, logs=[], sessions=[], active=localStorage.getItem('activeWorkout')||'Upper Body 1', timerId=null, timerEnd=0, currentSessionId=localStorage.getItem('currentSessionId')||null, saveTimers=new Map();
const BACKUP_VERSION=7;
function localDate(d=new Date()){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function uid(){return `${Date.now().toString(36)}-${crypto?.randomUUID?.()||Math.random().toString(36).slice(2)}`}
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function setStatus(text){$('syncStatus').textContent=text}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('sets'))d.createObjectStore('sets',{keyPath:'id'});if(!d.objectStoreNames.contains('sessions'))d.createObjectStore('sessions',{keyPath:'id'});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function all(store){return new Promise((res,rej)=>{let r=tx(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);})}
function put(store,obj){return new Promise((res,rej)=>{let r=tx(store,'readwrite').put(obj);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);})}
function clearStore(store){return new Promise((res,rej)=>{let r=tx(store,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error);})}
function delWhere(store,pred){return new Promise((res,rej)=>{let s=tx(store,'readwrite'),req=s.openCursor();req.onsuccess=e=>{let c=e.target.result;if(c){if(pred(c.value))c.delete();c.continue();}};req.onerror=()=>rej(req.error);s.transaction.oncomplete=()=>res();s.transaction.onerror=()=>rej(s.transaction.error);})}
async function load(){logs=await all('sets');sessions=await all('sessions');renderDashboard();renderHistory();renderSessionStrip()}
async function migrate(){let oldDb='TitanWorkoutV4';try{let old=await new Promise((res)=>{let r=indexedDB.open(oldDb);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onupgradeneeded=()=>{r.transaction.abort();res(null)}});if(!old||logs.length)return;let names=[...old.objectStoreNames];if(!names.includes('sets'))return;let oldLogs=await new Promise(res=>{let r=old.transaction('sets').objectStore('sets').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([])});for(let l of oldLogs){let sid=l.sessionId||`migrated-${l.date}-${l.workout}-${uid()}`;await put('sets',{...l,id:l.id?`v4-${l.id}-${uid()}`:uid(),sessionId:sid});if(!sessions.some(s=>s.id===sid))await put('sessions',{id:sid,date:l.date||localDate(),workout:l.workout||active,start:l.ts||new Date().toISOString(),end:null,completed:false,migrated:true})}}catch(e){console.warn('Migration skipped',e)}}
function currentSession(){return sessions.find(s=>s.id===currentSessionId)}
async function ensureSession(forceNew=false){let existing=currentSession();if(!forceNew&&existing&&existing.workout===active&&!existing.completed)return existing;let resumable=[...sessions].filter(s=>s.workout===active&&!s.completed).sort((a,b)=>b.start.localeCompare(a.start))[0];if(!forceNew&&resumable){currentSessionId=resumable.id;localStorage.setItem('currentSessionId',currentSessionId);return resumable}let s={id:uid(),date:localDate(),workout:active,start:new Date().toISOString(),end:null,completed:false};await put('sessions',s);sessions.push(s);currentSessionId=s.id;localStorage.setItem('currentSessionId',currentSessionId);return s}
function durationText(start,end){if(!start)return 'not started';let min=Math.max(0,Math.round((new Date(end||new Date())-new Date(start))/60000));return min+' min'}
function showView(v){$('dashboard').style.display=v==='dash'?'block':'none';$('trainView').style.display=v==='train'?'block':'none';$('libraryView').style.display=v==='library'?'block':'none';$('dataView').style.display=v==='data'?'block':'none';['Dash','Train','Library','Data'].forEach(x=>{let el=$('tab'+x);if(el)el.classList.toggle('active',v.toLowerCase()===x.toLowerCase())});if(v==='dash')renderDashboard();if(v==='library')renderLibrary();if(v==='data')renderData();window.scrollTo(0,0)}
function topRep(r){let m=String(r).match(/(\d+)(?!.*\d)/);return m?+m[1]:null}
function lastSets(ex){let same=logs.filter(l=>l.exercise===ex&&l.sessionId!==currentSessionId).sort((a,b)=>b.ts.localeCompare(a.ts));if(!same.length)return[];let sid=same[0].sessionId;return same.filter(l=>l.sessionId===sid).sort((a,b)=>a.set-b.set)}
function suggest(ex){let [n,sets,reps]=ex,last=lastSets(n),target=topRep(reps);if(!last.length)return'First logged session: choose a clean weight that leaves 1–2 reps in reserve.';let ok=last.length>=sets&&(!target||last.slice(0,sets).every(s=>+s.reps>=target));let vals=last.map(x=>+x.weight).filter(Number.isFinite),avg=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0;return ok&&avg?`You reached the top of the range last time. Consider increasing from about ${avg} lb.`:'Repeat the last load and improve reps with clean form.'}
function validateSet(weight,reps){let w=weight===''?null:Number(weight),r=reps===''?null:Number(reps);if(w!==null&&(!Number.isFinite(w)||w<0||w>2000))return'Weight must be between 0 and 2000.';if(r!==null&&(!Number.isInteger(r)||r<0||r>500))return'Reps must be a whole number between 0 and 500.';if(w===null&&r===null)return null;return''}
async function init(){db=await openDB();logs=await all('sets');sessions=await all('sessions');await migrate();await load();refreshWorkoutSelect();$('workoutSelect').onchange=async()=>{active=$('workoutSelect').value;localStorage.setItem('activeWorkout',active);currentSessionId=null;localStorage.removeItem('currentSessionId');await ensureSession();render()};$('start').onclick=async()=>{let s=currentSession();await ensureSession(!!s?.completed);await load();render()};$('finish').onclick=completeWorkout;$('reset').onclick=resetCurrentSession;$('duplicateWorkout').onclick=duplicateWorkout;$('restoreWorkout').onclick=restoreWorkoutDefaults;$('export').onclick=exportBackup;$('closeModal').onclick=()=>{$('modal').classList.remove('show');$('mVideo').innerHTML=''};$('closeComplete').onclick=()=>{$('completeModal').classList.remove('show')};$('cancelTimer').onclick=cancelTimer;$('tabDash').onclick=()=>showView('dash');$('tabTrain').onclick=()=>showView('train');$('tabLibrary').onclick=()=>showView('library');$('tabData').onclick=()=>showView('data');window.addEventListener('online',()=>setStatus('Online · autosaving on this device'));window.addEventListener('offline',()=>setStatus('Offline · autosaving on this device'));document.addEventListener('visibilitychange',()=>{if(document.hidden)flushPendingSaves()});window.addEventListener('beforeunload',flushPendingSaves);if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('./service-worker.js').then(()=>setStatus(navigator.onLine?'PWA ready · autosaving on this device':'Offline · autosaving on this device')).catch(()=>setStatus('Autosaving locally · offline cache unavailable'))}else setStatus(location.protocol==='file:'?'Open through localhost/HTTPS to install PWA':'Autosaving on this device');await ensureSession();await load();render()}
function render(){let arr=PROGRAM[active],out=`<div class="workout-head"><h2>${active}</h2><span class="pill">${arr.length} exercises</span></div>`;arr.forEach((ex,i)=>out+=card(ex,i));$('workout').innerHTML=out;document.querySelectorAll('[data-log]').forEach(b=>b.onclick=()=>saveSetFromButton(b));document.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>info(+b.dataset.info));document.querySelectorAll('[data-rest]').forEach(b=>b.onclick=()=>startTimer(b.dataset.rest));document.querySelectorAll('[data-edit-target]').forEach(b=>b.onclick=()=>editExerciseTarget(+b.dataset.editTarget));document.querySelectorAll('[data-substitute]').forEach(b=>b.onclick=()=>substituteExercise(+b.dataset.substitute));document.querySelectorAll('[data-move-up]').forEach(b=>b.onclick=()=>moveExercise(+b.dataset.moveUp,-1));document.querySelectorAll('[data-move-down]').forEach(b=>b.onclick=()=>moveExercise(+b.dataset.moveDown,1));document.querySelectorAll('[data-set-input]').forEach(inp=>{inp.addEventListener('input',()=>queueAutosave(inp));inp.addEventListener('change',()=>queueAutosave(inp,0));inp.addEventListener('blur',()=>queueAutosave(inp,0))});renderHistory();renderSessionStrip()}
function card(ex,i){let [n,sets,reps,tempo,rest,method,cues]=ex,rows='';for(let s=1;s<=sets;s++){let e=logs.find(l=>l.sessionId===currentSessionId&&l.exercise===n&&l.set===s)||{};rows+=`<div class="setrow"><div class="setnum">${s}</div><input data-set-input="${i}|${s}" id="w-${i}-${s}" type="number" min="0" max="2000" step="0.5" inputmode="decimal" placeholder="Weight" value="${esc(e.weight||'')}"><input data-set-input="${i}|${s}" id="r-${i}-${s}" type="number" min="0" max="500" step="1" inputmode="numeric" placeholder="Reps" value="${esc(e.reps||'')}"><button data-log="${i}|${s}" class="${e.ts?'done':''}" aria-label="Save set">${e.ts?'✓':'+'}</button></div>`}return`<section class="exercise"><div class="row"><div><div class="name">${i+1}. ${n}</div><div class="meta">${sets} sets • ${reps} reps • tempo ${tempo} • rest ${rest}</div></div><button data-info="${i}" class="ghost">Video / Info</button></div><p class="cues">${cues}</p><div class="suggestion">${suggest(ex)}</div>${rows}<div class="actions"><button data-rest="${rest}" class="primary">Rest ${rest}</button><button data-edit-target="${i}" class="ghost">Edit Target</button><button data-substitute="${i}" class="ghost">Substitute</button></div><div class="actions"><button data-move-up="${i}" class="ghost" ${i===0?'disabled':''}>Move Up</button><button data-move-down="${i}" class="ghost" ${i===PROGRAM[active].length-1?'disabled':''}>Move Down</button><button onclick="clearEx('${n.replace(/'/g,"\'")}')" class="ghost">Clear Exercise</button></div></section>`}
async function saveSetFromButton(btn){await saveSet(btn.dataset.log,false);render()}
async function saveSet(key,silent=true){let [i,s]=key.split('|').map(Number),ex=PROGRAM[active][i];if(!ex)return;let n=ex[0],weight=$(`w-${i}-${s}`)?.value.trim()||'',reps=$(`r-${i}-${s}`)?.value.trim()||'',err=validateSet(weight,reps);if(err){if(!silent)alert(err);setStatus('Not saved · check the highlighted values');return}let session=await ensureSession();let existing=logs.find(l=>l.sessionId===session.id&&l.exercise===n&&l.set===s);if(!weight&&!reps){if(existing){await delWhere('sets',l=>l.id===existing.id);await load()}return}let record={id:existing?.id||uid(),date:session.date,workout:active,exercise:n,set:s,weight,reps,ts:new Date().toISOString(),sessionId:session.id};await put('sets',record);let idx=logs.findIndex(l=>l.id===record.id);if(idx>=0)logs[idx]=record;else logs.push(record);setStatus('Saved on this device');let b=document.querySelector(`[data-log="${i}|${s}"]`);if(b){b.textContent='✓';b.classList.add('done')}renderHistory();renderSessionStrip();renderDashboard()}
async function clearEx(n){let s=currentSession();if(!s)return;if(!confirm(`Clear all logged sets for ${n} in this workout?`))return;await delWhere('sets',l=>l.sessionId===s.id&&l.exercise===n);await load();render()}
async function resetCurrentSession(){let s=currentSession();if(!s)return;if(!confirm('Reset this workout? All sets in the current session will be deleted.'))return;await delWhere('sets',l=>l.sessionId===s.id);await delWhere('sessions',x=>x.id===s.id);currentSessionId=null;localStorage.removeItem('currentSessionId');await load();await ensureSession();await load();render()}
function videoEmbed(info,name){let q=info.videoSearch,open=`https://www.youtube.com/results?search_query=${q}`;if(!navigator.onLine)return `<div class="suggestion">Video demonstrations require an internet connection. Your workout logging still works offline.</div><a class="youtubeBanner" target="_blank" rel="noopener" href="${open}">Open when online</a>`;if(info.videoId){let embed=`https://www.youtube-nocookie.com/embed/${encodeURIComponent(info.videoId)}?rel=0&modestbranding=1`;return `<div class="videoWrap"><iframe title="${esc(name)} demonstration" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen src="${embed}"></iframe></div><div class="suggestion"><b>Curated source:</b> ${esc(info.videoSource)} — ${esc(info.videoTitle)}. Confirm the demonstrated variation matches the equipment you are using.</div><a class="youtubeBanner" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${encodeURIComponent(info.videoId)}">Watch in YouTube</a><a class="youtubeBanner" target="_blank" rel="noopener" href="${open}">Find another exact variation</a>`}return `<div class="suggestion"><b>Exact-match search:</b> This less-common variation does not yet have a verified embedded video. The button opens a targeted hypertrophy-form search instead of showing the wrong movement.</div><a class="youtubeBanner" target="_blank" rel="noopener" href="${open}">Find ${esc(name)} video</a>`}
function info(i){let ex=PROGRAM[active][i],n=ex[0],lib=EXLIB[n];$('mTitle').textContent=n;$('mMeta').textContent=`${ex[5]} | ${ex[1]} sets | ${ex[2]} reps | ${ex[3]} tempo | ${ex[4]} rest`;$('mVideo').innerHTML=videoEmbed(lib,n);$('mDetails').innerHTML=`<h3>Primary Focus</h3>${lib.muscles.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}<div class="grid2"><div><h3>Setup / Performance</h3><ul>${lib.setup.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div><h3>Common Mistakes</h3><ul>${lib.mistakes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div><h3>Tips</h3><ul>${lib.tips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;let last=lastSets(n);$('mLast').textContent=last.length?`Last: ${last.map(s=>`${s.weight}×${s.reps}`).join(', ')}`:'No previous logged sets yet.';$('modal').classList.add('show')}
function startTimer(rest){cancelTimer();let seconds=parseInt(rest,10)||45;timerEnd=Date.now()+seconds*1000;$('timer').classList.add('show');updateTimer();timerId=setInterval(updateTimer,250)}
function updateTimer(){let remaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));$('timerText').textContent=`Rest: ${remaining}s`;if(remaining<=0){cancelTimer();try{navigator.vibrate?.([250,100,250])}catch{};try{let ctx=new (window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);g.gain.value=.08;o.start();o.stop(ctx.currentTime+.35)}catch{};$('timerText').textContent='Rest complete';$('timer').classList.add('show');setTimeout(()=>$('timer').classList.remove('show'),2500)}}
function cancelTimer(){if(timerId)clearInterval(timerId);timerId=null;$('timer').classList.remove('show')}
function renderHistory(){let recent=[...logs].sort((a,b)=>b.ts.localeCompare(a.ts)).slice(0,12);$('history').innerHTML=recent.length?recent.map(l=>`<div class="history"><b>${esc(l.date)}</b> · ${esc(l.workout)}<br>${esc(l.exercise)} set ${l.set}: ${esc(l.weight)} × ${esc(l.reps)}</div>`).join(''):'No logs yet.'}
function sessionSummaries(){return sessions.map(s=>{let ls=logs.filter(l=>l.sessionId===s.id),ex=new Set(ls.map(l=>l.exercise));return{id:s.id,date:s.date,workout:s.workout,sets:ls.length,volume:ls.reduce((a,l)=>a+(+l.weight||0)*(+l.reps||0),0),exCount:ex.size,session:s}}).filter(s=>s.sets||s.session.completed).sort((a,b)=>(b.session.end||b.session.start).localeCompare(a.session.end||a.session.start))}
function renderDashboard(){if(!$('dashboard'))return;let ss=sessionSummaries(),now=new Date(),ym=localDate(now).slice(0,7),thisMonth=ss.filter(s=>s.date.startsWith(ym)).length,total=ss.filter(s=>s.session.completed).length,last=ss[0],cutoff=new Date(now);cutoff.setDate(cutoff.getDate()-30);let days30=ss.filter(s=>new Date(s.date+'T00:00:00')>=cutoff).length,cal=calendarHtml(now),prs=personalRecords().slice(0,5);$('dashboard').innerHTML=`<section class="install"><b>Device-only storage:</b> Titan autosaves every entry to this phone or computer. The app works offline after proper installation; videos require internet.</section><section class="card"><h2>Dashboard</h2><div class="stats"><div class="stat"><span class="small">Completed</span><b>${total}</b></div><div class="stat"><span class="small">Last 30 days</span><b>${days30}</b></div><div class="stat"><span class="small">This month</span><b>${thisMonth}</b></div></div><p class="meta" style="margin-top:12px">Last workout: ${last?`${esc(last.date)} — ${esc(last.workout)}`:'none yet'}</p><button class="primary" style="width:100%;margin-top:10px" onclick="showView('train')">Start / Log Workout</button></section><section class="card"><h2>Workout Calendar</h2>${cal}</section><section class="card"><h2>Top Personal Records</h2>${prs.length?prs.map(p=>`<div class="history"><b>${esc(p.exercise)}</b><br>Best weight: ${p.maxWeight} · Best volume set: ${p.maxVolume}</div>`).join(''):'No records yet.'}</section><section class="card"><h2>Workout History</h2>${ss.slice(0,12).map(s=>`<div class="history"><b>${esc(s.date)}</b> · ${esc(s.workout)}<br>${s.sets} sets · ${Math.round(s.volume)} lb volume · ${s.exCount} exercises ${s.session.completed?'· completed':'· in progress'}</div>`).join('')||'No workouts yet.'}</section>`}
function calendarHtml(d){let y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),summaries=sessionSummaries(),done=new Set(summaries.map(s=>s.date));let html='<div class="row"><b>'+first.toLocaleString(undefined,{month:'long',year:'numeric'})+'</b><span class="pill">green = logged</span></div><div class="calendar">';['S','M','T','W','T','F','S'].forEach(x=>html+='<div class="dow">'+x+'</div>');for(let i=0;i<first.getDay();i++)html+='<div></div>';for(let day=1;day<=last.getDate();day++){let iso=localDate(new Date(y,m,day)),cls='day '+(done.has(iso)?'doneDay ':'')+(iso===localDate()?'today':'');let wk=summaries.filter(s=>s.date===iso).map(s=>esc(s.workout.replace(' Body',''))).join('<br>');html+=`<div class="${cls}"><b>${day}</b><br><span class="small">${wk}</span></div>`}return html+'</div>'}
function personalRecords(){let by={};logs.forEach(l=>{let w=+l.weight||0,r=+l.reps||0,v=w*r;if(!by[l.exercise])by[l.exercise]={exercise:l.exercise,maxWeight:0,maxVolume:0};by[l.exercise].maxWeight=Math.max(by[l.exercise].maxWeight,w);by[l.exercise].maxVolume=Math.max(by[l.exercise].maxVolume,v)});return Object.values(by).sort((a,b)=>b.maxVolume-a.maxVolume)}
async function completeWorkout(){await flushPendingSaves();let s=await ensureSession(),ls=logs.filter(l=>l.sessionId===s.id);if(!ls.length&&!confirm('No sets are logged. Complete this workout anyway?'))return;s={...s,end:new Date().toISOString(),completed:true};await put('sessions',s);await load();let vol=ls.reduce((a,l)=>a+(+l.weight||0)*(+l.reps||0),0),ex=new Set(ls.map(l=>l.exercise));$('completeSummary').innerHTML=`<div class="completeBox"><div class="stats"><div class="stat"><span class="small">Duration</span><b>${durationText(s.start,s.end)}</b></div><div class="stat"><span class="small">Sets</span><b>${ls.length}</b></div><div class="stat"><span class="small">Volume</span><b>${Math.round(vol)}</b></div></div><p>${esc(active)} complete. ${ex.size} exercises logged.</p></div>`;$('completeModal').classList.add('show');currentSessionId=null;localStorage.removeItem('currentSessionId');renderDashboard();renderSessionStrip()}
function renderSessionStrip(){let s=currentSession(),ls=s?logs.filter(l=>l.sessionId===s.id):[];$('sessionStrip').textContent=s?`${s.completed?'Completed':'In progress'} · started ${new Date(s.start).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})} · ${ls.length} saved sets`:'No active workout session'}
function renderLibrary(){let names=Object.keys(EXLIB).sort();$('libraryView').innerHTML=`<section class="card"><h2>Exercise Library</h2><p class="meta">Tap an exercise during training for setup cues and video links. Broken embedded YouTube search players have been removed. Verified videos are embedded where an exact or close instructional match was found. Less-common variations use a targeted hypertrophy search so Titan does not show the wrong movement.</p>${names.map(n=>`<div class="history"><b>${esc(n)}</b><br>${EXLIB[n].muscles.map(m=>`<span class="tag">${esc(m)}</span>`).join('')}</div>`).join('')}</section>`}
function backupObject(){return{app:'Titan Workout Tracker',version:BACKUP_VERSION,exportedAt:new Date().toISOString(),sets:logs,sessions,program:PROGRAM}}
function renderData(){$('dataView').innerHTML=`<section class="card"><h2>Data / Backup</h2><p class="meta">Your data is stored only on this device in IndexedDB. Export a backup before clearing browser data or changing phones.</p><div class="actions"><button class="primary" onclick="exportBackup()">Export Backup JSON</button><label class="ghost" style="border:1px solid var(--line);padding:12px 14px;border-radius:12px;text-align:center;cursor:pointer">Import Backup<input type="file" accept="application/json,.json" onchange="importBackup(event)" style="display:none"></label></div><h3>Import behaviour</h3><select id="importMode"><option value="replace">Replace all current Titan data</option><option value="merge">Merge without duplicates</option></select><h3>Current Data Preview</h3><textarea readonly>${esc(JSON.stringify(backupObject(),null,2).slice(0,1800))}</textarea></section>`}
function exportBackup(){let blob=new Blob([JSON.stringify(backupObject(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`titan-workout-v61-backup-${localDate()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function validBackup(data){if(!data||typeof data!=='object')throw Error('This is not a Titan backup file.');if(!Array.isArray(data.sets)||!Array.isArray(data.sessions))throw Error('Backup is missing sets or sessions.');if(data.program&&typeof data.program!=='object')throw Error('Backup program is invalid.');for(let s of data.sessions){if(!s.id||!s.date||!s.workout)throw Error('A workout session is invalid.')}for(let l of data.sets){if(!l.exercise||!l.sessionId||!Number.isInteger(Number(l.set)))throw Error('A logged set is invalid.')}return true}
function dedupeKey(l){return `${l.sessionId}|${l.exercise}|${l.set}`}
function importBackup(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=async()=>{try{let data=JSON.parse(reader.result);validBackup(data);let mode=$('importMode')?.value||'replace';if(!confirm(mode==='replace'?'Replace all current Titan workout data with this backup?':'Merge this backup with current data?'))return;if(mode==='replace'){await clearStore('sets');await clearStore('sessions')}let existingSessions=new Map((await all('sessions')).map(s=>[s.id,s])),existingLogs=new Map((await all('sets')).map(l=>[dedupeKey(l),l]));for(let s of data.sessions){if(!existingSessions.has(s.id)||mode==='replace')await put('sessions',s)}for(let l of data.sets){let key=dedupeKey(l);if(!existingLogs.has(key)||mode==='replace')await put('sets',{...l,id:l.id||uid()})}if(data.program){PROGRAM=cloneProgram(data.program);saveProgram();refreshWorkoutSelect()}currentSessionId=null;localStorage.removeItem('currentSessionId');await load();render();renderData();alert('Backup imported successfully.')}catch(err){alert('Import failed: '+err.message)}finally{e.target.value=''}};reader.readAsText(f)}
init();
</script>
