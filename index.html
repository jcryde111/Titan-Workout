<body>
<header><p class="eyebrow">Project Titan</p><h1>Workout Tracker V6.4</h1><div class="small" id="syncStatus">IndexedDB + PWA ready</div></header>
<main>
<section class="tabs"><button id="tabDash" class="tab active">Dashboard</button><button id="tabTrain" class="tab">Train</button><button id="tabLibrary" class="tab">Library</button><button id="tabData" class="tab">Data</button></section>
<section id="dashboard"></section>
<section id="trainView" style="display:none">
  <section class="card">
    <label>Program</label><select id="programSelect"></select>
    <label style="margin-top:12px">Workout</label><select id="workoutSelect"></select>
    <div id="programNotice"></div>
    <div class="row" style="margin-top:12px"><button id="start" class="primary">Open Workout</button><button id="finish" class="gold">Complete Workout</button><button id="reset" class="danger">Reset Current</button></div>
    <div class="row" style="margin-top:10px"><button id="duplicateWorkout" class="blue">Duplicate & Customize</button><button id="restoreWorkout" class="ghost">Restore Default</button></div>
    <div id="sessionStrip" class="small" style="margin-top:10px"></div>
  </section>
  <section id="notesCard" class="card"><h2>Workout Notes <span id="noteStatus" class="note-status"></span></h2><p class="meta">Capture changes this week, equipment limitations, substitutions, discomfort, or anything you want to remember next time.</p><textarea id="workoutNotes" placeholder="Example: Hotel gym this week; cable stack felt heavier; substituted split squats for front squats..."></textarea></section>
  <section id="workout"></section>
</section>
<section id="libraryView" style="display:none"></section>
<section id="dataView" style="display:none"></section>
</main>
<nav class="bottomnav"><button onclick="showView('dash')">Dashboard</button><button class="primary" onclick="showView('train')">Train</button><button onclick="showView('library')">Library</button><button onclick="showView('data')">Data</button></nav>
<div id="modal" class="modal"><div class="modalbox"><h2 id="mTitle"></h2><p id="mMeta" class="meta"></p><div id="mVideo"></div><div id="mDetails"></div><div id="mLast" class="suggestion"></div><button id="closeModal" class="primary" style="width:100%">Close</button></div></div>
<div id="subModal" class="modal"><div class="modalbox"><h2 id="subTitle">Choose Substitute</h2><p id="subMeta" class="meta"></p><div id="subFilters" class="subfilters"></div><div id="subList"></div><button id="closeSub" class="ghost" style="width:100%">Cancel</button></div></div>
<div id="completeModal" class="modal"><div class="modalbox"><h2>Workout Complete</h2><div id="completeSummary"></div><button id="closeComplete" class="primary" style="width:100%">Close</button></div></div>
<div id="timer" class="timer"><b id="timerText">Rest</b><button id="cancelTimer" class="ghost">Cancel</button></div>
<script>
const LEAN_MASS_DEFAULT={"Upper Body 1":[["Push Press",3,"10-15","3-1-1-0","90 sec","Power / compound","Core braced; controlled lower; drive through legs."],["Spider Curl",3,"10-15","3-1-1-1","60 sec","Superset A","Elbows fixed; squeeze at top."],["Incline Triceps Extension",3,"10-15","3-1-1-1","60 sec","Superset A","Long stretch; elbows stay in."],["Lateral Raise",3,"12-20","3-1-1-1","60 sec","Isolation","Lead with elbows; no swinging."],["Rear Delt Row",3,"10-15","3-1-1-1","60 sec","Superset B","Pull elbows wide; pause/squeeze."],["Reverse Crunch",3,"10-15","2-1-2-1","45 sec","Superset B","Slow curl; no momentum."],["Rope Curl",3,"10-15","3-1-1-1","60 sec","Isolation","Open rope at top."],["Triceps Rope Extension",3,"8-8-8","Controlled","75 sec","Mechanical/drop method","Keep shoulders down; finish hard."],["Bird Dog",3,"8-12/side","2-2-2-1","45 sec","Core/stability","Hips square; reach long."]],"Lower Body 1":[["Hip Thrust",4,"8-12","3-1-1-2","90 sec","Glute focus","Full lockout; ribs down."],["Sumo Deadlift",3,"8-12","3-1-1-1","120 sec","Posterior chain","Brace; push floor apart."],["Lying Leg Curl",3,"10-15","3-1-1-1","75 sec","Hamstrings","Hips down; control negative."],["Single-Leg Hip Thrust",3,"10-15/side","3-1-1-1","60 sec","Unilateral","Square hips; full range."],["Good Morning",3,"8-12","3-1-1-1","90 sec","Hinge","Soft knees; neutral spine."],["Hip Abduction",3,"15-25","2-1-2-1","45 sec","Glute med","Pause wide; no bounce."],["Calf Raise",4,"10-15","3-1-1-2","45 sec","Calves","Deep stretch; hard squeeze."],["Dead Bug",3,"8-12/side","2-1-2-1","45 sec","Core","Low back stays down."]],"Upper Body 2":[["Incline Press",3,"8-12","3-1-1-1","90 sec","Compound push","Control lower; no bounce."],["Reverse-Grip Row",3,"8-12","3-1-1-1","90 sec","Compound pull","Pull to lower ribs."],["Decline Press",3,"8-12","3-1-1-1","90 sec","Chest","Shoulders packed."],["Chin-Up / Assisted Chin-Up",3,"6-10","3-1-1-1","90 sec","Vertical pull","Full hang to chest-up pull."],["Close-Grip Press",3,"8-12","3-1-1-1","75 sec","Triceps/chest","Elbows 30-45 degrees."],["Cable Fly",3,"12-15","3-1-1-1","60 sec","Chest isolation","Big stretch; hug motion."],["Pullover",3,"10-15","3-1-1-1","60 sec","Lats/serratus","Ribs down; stretch lats."],["Rear Delt Raise",3,"12-20","3-1-1-1","45 sec","Rear delts","Small controlled movement."],["Plank",3,"30-60 sec","Hold","45 sec","Core","Hard brace; glutes on."]],"Lower Body 2":[["Front Squat",3,"6-10","3-1-1-1","120 sec","Quad strength","Upright torso; full depth."],["Full Squat",3,"8-12","3-1-1-1","120 sec","Compound legs","Go lighter if depth is lost."],["Front-Foot Elevated Split Squat",3,"8-12/side","3-1-1-1","90 sec","Unilateral legs","Knee forward; control depth."],["Sissy Squat",3,"10-15","3-1-1-1","75 sec","Quad isolation","Keep tension; use assistance."],["Leg Extension",3,"12-20","3-1-1-1","60 sec","Quad isolation","Pause squeeze at top."],["Seated/Lying Hamstring Curl",3,"10-15","3-1-1-1","75 sec","Hamstrings","Control every rep."],["Standing Calf Raise",4,"10-15","3-1-1-2","45 sec","Calves","Full stretch and squeeze."],["Suitcase Carry",3,"30-60 sec/side","Walk","60 sec","Loaded carry","Tall posture; don't lean."]]};

function stsEx(name,sets,reps,method='Standard sets',group='Other',cues='Use controlled form and complete the prescribed rep range.'){
  let rest=(group==='Abs'||group==='Calves')?'60 sec':(sets>=4?'90 sec':'75 sec');
  return [name,sets,reps,'Controlled',rest,method,cues];
}
function buildShortcutWorkouts(){
  const main=['12-15','9-11','6-8','3-5'],calf=['25-30','15-20','10-14','6-9'],abs=['20-30','15-19','10-14','6-9'];
  const phaseData={
    1:{
      chest:[['Bench Press',4],['Incline Bench Press',3],['Incline Dumbbell Flye',3],['Cable Crossover',3]],
      tri:[['Triceps Pressdown',3],['Lying Triceps Extension',3],['Cable Overhead Triceps Extension',3]],
      back:[['Dumbbell Bent-Over Row',4],['Wide-Grip Pulldown',3],['Standing Pulldown',3],['Straight Arm Pulldown',3]],
      bi:[['Barbell Curl',4],['Dumbbell Incline Curl',3],['One-Arm High Cable Curl',3]],
      sh:[['Dumbbell Shoulder Press',4],['Dumbbell Lateral Raise',3],['One-Arm Cable Front Raise',3],['High Cable Rear Delt Fly',3],['Dumbbell Shrug',4]],
      legs:[['Squat',4],['One-Leg Leg Press',3],['Leg Extension',3],['Romanian Deadlift',4],['Lying Leg Curl',3]], plank:[60,60,0,75]
    },
    2:{
      chest:[['Bench Press',4],['Incline Dumbbell Press',3],['Dumbbell Flye',3],['Incline Cable Flye',3]],
      tri:[['Triceps Pressdown',3],['Dumbbell Overhead Triceps Extension',3],['Cable Lying Triceps Extension',3]],
      back:[['Dumbbell Bent-Over Row',4],['Behind-Neck Pulldown',3],['Seated Cable Row',3],['Reverse-Grip Pulldown',3]],
      bi:[['Barbell Curl',4],['Preacher Curl',3],['Behind-Back Cable Curl',3]],
      sh:[['Dumbbell Shoulder Press',4],['Smith Machine Upright Row',3],['One-Arm Cable Lateral Raise',3],['Bent-Over Lateral Raise',3],['Barbell Shrug',4]],
      legs:[['Squat',4],['Front Squat',3],['Leg Extension',3],['Romanian Deadlift',4],['Seated Leg Curl',3]], plank:[75,75,0,90]
    },
    3:{
      chest:[['Bench Press',4],['Reverse-Grip Incline Dumbbell Press',3],['Incline Dumbbell Flye',3],['Cable Crossover',3]],
      tri:[['Triceps Pressdown',3],['One-Arm Overhead Cable Triceps Extension',3],['Close-Grip Bench Press',3]],
      back:[['Dumbbell Bent-Over Row',4],['Wide-Grip Pulldown',3],['Straight-Arm Pulldown',3],['Seated Cable Row',3]],
      bi:[['Barbell Curl',4],['Incline Cable Curl',3],['Dumbbell Concentration Curl',3]],
      sh:[['Dumbbell Shoulder Press',4],['Dumbbell Lateral Raise',3],['Dumbbell Upright Row',3],['Bent-Over Lateral Raise',3],['One-Arm Smith Machine Shrug',4]],
      legs:[['Squat',4],['Leg Press',3],['Leg Extension',3],['Romanian Deadlift',4],['Lying Leg Curl',3]], plank:[90,90,0,105]
    }
  };
  const out={};
  for(let phase=1;phase<=3;phase++) for(let wi=1;wi<=4;wi++){
    let week=(phase-1)*4+wi,p=phaseData[phase],tech=wi<=2?'Rest-pause on last set':'Drop set on last set',mr=main[wi-1],cr=calf[wi-1],ar=abs[wi-1];
    let map=(arr,g)=>arr.map(([n,s])=>stsEx(n,s,mr,tech,g,`${tech}. Keep the same load across working sets and reach at least the minimum prescribed reps.`));
    let w1=[...map(p.chest,'Chest'),...map(p.tri,'Triceps'),stsEx('Standing Calf Raise',4,cr,tech,'Calves'),stsEx('Seated Calf Raise',4,cr,tech,'Calves')];
    let abs2,abs4;
    if(wi===1){abs2=[stsEx('Hip Thrust',3,ar,tech,'Abs'),stsEx('Crunch',3,ar,tech,'Abs'),stsEx('Oblique Crunch',3,ar,tech,'Abs')];abs4=[stsEx('Hip Thrust',3,ar,tech,'Abs'),stsEx('Crunch',3,ar,tech,'Abs'),stsEx('Plank',3,`${p.plank[0]} sec`,tech,'Abs')];}
    if(wi===2){abs2=[stsEx('Hanging Leg Raise',3,ar,tech,'Abs'),stsEx('Weighted Crunch',3,ar,tech,'Abs'),stsEx('Dumbbell Side Bend',3,ar,tech,'Abs')];abs4=[stsEx('Hanging Leg Raise',3,ar,tech,'Abs'),stsEx('Weighted Crunch',3,ar,tech,'Abs'),stsEx('Side Plank',3,`${p.plank[1]} sec`,tech,'Abs')];}
    if(wi===3){abs2=[stsEx('Weighted Hip Thrust',3,ar,tech,'Abs'),stsEx('Cable Crunch',3,ar,tech,'Abs'),stsEx('Cable Oblique Crunch',3,ar,tech,'Abs')];abs4=[stsEx('Weighted Hip Thrust',3,ar,tech,'Abs'),stsEx('Cable Crunch',3,ar,tech,'Abs'),stsEx('Cable Woodchopper',3,ar,tech,'Abs')];}
    if(wi===4){abs2=[stsEx('Smith Machine Hip Thrust',3,ar,tech,'Abs'),stsEx('Machine Crunch',3,ar,tech,'Abs'),stsEx('Band Roundhouse Elbow',3,ar,tech,'Abs')];abs4=[stsEx('Smith Machine Hip Thrust',3,ar,tech,'Abs'),stsEx('Machine Crunch',3,ar,tech,'Abs'),stsEx('Plank',3,`${p.plank[3]} sec`,tech,'Abs')];}
    let w2=[...map(p.back,'Back / Lats'),...map(p.bi,'Biceps'),...abs2];
    let w3=[...map(p.sh,'Shoulders'),stsEx('Seated Calf Raise',4,cr,tech,'Calves'),stsEx('Leg Press Calf Raise',4,cr,tech,'Calves')];
    let w4=[...map(p.legs,'Quads'),...abs4];
    out[`Week ${week} · Workout 1 — Chest, Triceps, Calves`]=w1;
    out[`Week ${week} · Workout 2 — Back, Biceps, Abs`]=w2;
    out[`Week ${week} · Workout 3 — Shoulders, Traps, Calves`]=w3;
    out[`Week ${week} · Workout 4 — Legs and Abs`]=w4;
  }
  return out;
}
const SHORTCUT_TO_SIZE_WORKOUTS=buildShortcutWorkouts();

const DEFAULT_PROGRAMS={
  "Lean Mass Builder":{name:"Lean Mass Builder",description:"Current 4-workout lean-mass plan.",workouts:LEAN_MASS_DEFAULT},
  "Shortcut to Size":{name:"Shortcut to Size",description:"Jim Stoppani’s 12-week periodized size-and-strength program, populated from the user-provided 14-page program PDF. It uses four weekly microcycles repeated across three phases.",schedule:"12 weeks · 4 workouts/week · Weeks 1–2: rest-pause on the last set · Weeks 3–4: drop set on the last set · rep ranges cycle 12–15, 9–11, 6–8, 3–5.",workouts:SHORTCUT_TO_SIZE_WORKOUTS,sourcePending:false,sourceLabel:"User-provided Shortcut to Size PDF"}
};
function clone(v){return JSON.parse(JSON.stringify(v))}
function loadPrograms(){try{let p=JSON.parse(localStorage.getItem('titanProgramsV63')||'null');if(p&&p['Lean Mass Builder']){let sts=p['Shortcut to Size'];if(!sts||sts.sourcePending||Object.keys(sts.workouts||{}).length<40)p['Shortcut to Size']=clone(DEFAULT_PROGRAMS['Shortcut to Size']);return p}let old=JSON.parse(localStorage.getItem('titanCustomProgram')||'null');let base=clone(DEFAULT_PROGRAMS);if(old&&typeof old==='object')base['Lean Mass Builder'].workouts=old;return base}catch{return clone(DEFAULT_PROGRAMS)}}
let PROGRAMS=loadPrograms();
let activeProgram=localStorage.getItem('activeProgram')||'Lean Mass Builder';if(!PROGRAMS[activeProgram])activeProgram='Lean Mass Builder';
let active=localStorage.getItem('activeWorkout')||Object.keys(PROGRAMS[activeProgram].workouts)[0];
function savePrograms(msg='Program changes saved on this device'){localStorage.setItem('titanProgramsV63',JSON.stringify(PROGRAMS));setStatus(msg)}
function currentProgram(){return PROGRAMS[activeProgram]}
function baseWorkout(){return currentProgram()?.workouts?.[active]||[]}

const EXLIB={};
function addEx(name,group,env,motion,sets=3,reps='8-12',tempo='3-1-1-1',rest='75 sec',method='Hypertrophy',cues='Control the range; keep tension on the target muscle.'){
 EXLIB[name]={name,group,environments:env,motion,defaults:[name,sets,reps,tempo,rest,method,cues],muscles:[group],setup:['Set up with a stable position and a repeatable range of motion.','Use a load you can control without momentum.'],mistakes:['Rushing the lowering phase.','Changing body position to finish reps.'],tips:['Keep 1–2 reps in reserve until technique is consistent.','Use the prior-set values as your starting reference.'],videoSearch:`https://www.youtube.com/results?search_query=${encodeURIComponent(name+' proper form 60 second exercise tutorial')}`}
}
// Chest

function card(ex,i){let [n,sets,reps,tempo,rest,method,cues]=ex,info=EXLIB[n]||{group:'Other',environments:['Gym'],motion:'press',videoSearch:`https://www.youtube.com/results?search_query=${encodeURIComponent(n+' proper form 60 second tutorial')}`},rows='';for(let s=1;s<=sets;s++){let e=logs.find(l=>l.sessionId===currentSessionId&&l.exercise===n&&Number(l.set)===s)||{},prev=previousSet(n,s),prevText=prev?`${prev.weight||'—'} × ${prev.reps||'—'}`:'—';rows+=`<div class="setrow"><div class="setnum">${s}</div><input data-set-input="${i}|${s}" id="w-${i}-${s}" type="number" min="0" max="2000" step="0.5" inputmode="decimal" placeholder="Weight" value="${esc(e.weight||'')}"><input data-set-input="${i}|${s}" id="r-${i}-${s}" type="number" min="0" max="500" step="1" inputmode="numeric" placeholder="Reps" value="${esc(e.reps||'')}"><div class="previous" title="Previous completed ${esc(active)}">${esc(prevText)}</div><button data-log="${i}|${s}" class="${e.ts?'done':''}" aria-label="Save set">${e.ts?'✓':'+'}</button></div>`}return`<section class="exercise"><div class="row"><div><div class="name">${i+1}. ${esc(n)}</div><div class="meta">${sets} sets • ${esc(reps)} reps • tempo ${esc(tempo)} • rest ${esc(rest)}<br>${esc(info.group||method)} · ${(info.environments||[]).map(esc).join(' / ')}</div></div></div>${motionPreview(info)}<a class="video-link" target="_blank" rel="noopener" href="${info.videoSearch}">Short form video search (under 3 min preferred)</a><button data-info="${i}" class="ghost" style="width:100%">More Info / Form Cues</button><p class="cues">${esc(cues)}</p><div class="suggestion">${esc(suggest(ex))}</div><div class="setlabels"><div>Set</div><div>Weight</div><div>Reps</div><div>Last</div><div>Save</div></div>${rows}<div class="actions"><button data-rest="${esc(rest)}" class="primary">Rest ${esc(rest)}</button><button data-edit-target="${i}" class="ghost">Edit Target</button><button data-substitute="${i}" class="blue">Substitute</button><button onclick="clearEx(${i})" class="ghost">Clear Sets</button></div></section>`}
function queueAutosave(inp,delay=450){let key=inp.dataset.setInput;if(!key)return;let old=saveTimers.get(key);if(old)clearTimeout(old);saveTimers.set(key,setTimeout(async()=>{saveTimers.delete(key);await saveSet(key,true)},delay));setStatus('Saving…')}
async function flushPendingSaves(){let keys=[...saveTimers.keys()];saveTimers.forEach(t=>clearTimeout(t));saveTimers.clear();for(let key of keys)await saveSet(key,true)}
async function saveSetFromButton(btn){await saveSet(btn.dataset.log,false);render()}
async function saveSet(key,silent=true){let [i,s]=key.split('|').map(Number),ex=effectiveWorkout()[i];if(!ex)return;let n=ex[0],weight=$(`w-${i}-${s}`)?.value.trim()||'',reps=$(`r-${i}-${s}`)?.value.trim()||'',err=validateSet(weight,reps);if(err){if(!silent)alert(err);setStatus('Not saved · check values');return}let session=await ensureSession(),existing=logs.find(l=>l.sessionId===session.id&&l.exercise===n&&Number(l.set)===s);if(!weight&&!reps){if(existing){await delWhere('sets',l=>l.id===existing.id);await load()}return}let now=new Date().toISOString();let record={id:existing?.id||uid(),date:session.date,program:activeProgram,workout:active,exercise:n,set:s,weight,reps,ts:now,sessionId:session.id};await put('sets',record);let idx=logs.findIndex(l=>l.id===record.id);if(idx>=0)logs[idx]=record;else logs.push(record);session={...session,updatedAt:now};await put('sessions',session);let si=sessions.findIndex(x=>x.id===session.id);if(si>=0)sessions[si]=session;setStatus('Saved on this device');let b=document.querySelector(`[data-log="${i}|${s}"]`);if(b){b.textContent='✓';b.classList.add('done')}renderSessionStrip();renderDashboard()}
async function clearEx(i){let ex=effectiveWorkout()[i],s=currentSession();if(!ex||!s)return;if(!confirm(`Clear all logged sets for ${ex[0]} in this workout?`))return;await delWhere('sets',l=>l.sessionId===s.id&&l.exercise===ex[0]);await load();render()}
function queueNoteSave(){clearTimeout(noteTimer);$('noteStatus').textContent='Saving…';noteTimer=setTimeout(flushNoteSave,500)}
async function flushNoteSave(){clearTimeout(noteTimer);noteTimer=null;let text=$('workoutNotes')?.value||'';if(!text&&!currentSession()){$('noteStatus').textContent='';return}let s=await ensureSession();s={...s,notes:text,updatedAt:new Date().toISOString()};await put('sessions',s);let idx=sessions.findIndex(x=>x.id===s.id);if(idx>=0)sessions[idx]=s;$('noteStatus').textContent='Saved';setTimeout(()=>{if($('noteStatus'))$('noteStatus').textContent=''},1200)}
function loadNotes(){let s=currentSession();$('workoutNotes').value=sessionMatches(s)?(s.notes||''):'';$('noteStatus').textContent=''}
async function resetCurrentSession(){let s=currentSession();if(!s)return;if(!confirm('Reset this current workout? Sets, notes, and temporary substitutions in this session will be deleted.'))return;await delWhere('sets',l=>l.sessionId===s.id);await delWhere('sessions',x=>x.id===s.id);currentSessionId=null;localStorage.removeItem('currentSessionId');await load();render();loadNotes()}
function editExerciseTarget(i){let arr=effectiveWorkout(),ex=arr[i];if(!ex)return;let sets=prompt('Target sets:',String(ex[1]));if(sets===null)return;sets=Number(sets);if(!Number.isInteger(sets)||sets<1||sets>20){alert('Sets must be 1–20.');return}let reps=prompt('Target reps/range:',String(ex[2]));if(reps===null||!reps.trim())return;let rest=prompt('Rest period:',String(ex[4]));if(rest===null||!rest.trim())return;applyExerciseChange(i,[ex[0],sets,reps.trim(),ex[3],rest.trim(),ex[5],ex[6]],false)}
async function applyExerciseChange(i,newEx,permanent){if(permanent){currentProgram().workouts[active][i]=clone(newEx);savePrograms()}else{let s=await ensureSession();s.overrides=s.overrides||{};s.overrides[i]=clone(newEx);s.updatedAt=new Date().toISOString();await put('sessions',s);let si=sessions.findIndex(x=>x.id===s.id);if(si>=0)sessions[si]=s}render()}
function openSubstitute(i){let ex=effectiveWorkout()[i],info=EXLIB[ex[0]];if(!info){alert('No muscle-group data is available for this exercise yet.');return}subIndex=i;subFilter='All';$('subTitle').textContent='Substitute '+ex[0];$('subMeta').textContent=`Showing alternatives for ${info.group}. Choose based on where you are training.`;renderSubList();$('subModal').classList.add('show')}
function renderSubList(){let current=effectiveWorkout()[subIndex],base=EXLIB[current[0]],filters=['All','Gym','Hotel','Bodyweight'];$('subFilters').innerHTML=filters.map(f=>`<button class="${subFilter===f?'active':''}" onclick="setSubFilter('${f}')">${f}</button>`).join('');let choices=Object.values(EXLIB).filter(x=>x.group===base.group&&x.name!==current[0]&&(subFilter==='All'||x.environments.includes(subFilter))).sort((a,b)=>a.name.localeCompare(b.name));$('subList').innerHTML=choices.length?choices.map(x=>`<div class="subitem"><b>${esc(x.name)}</b><div class="meta">${esc(x.group)} · ${x.environments.map(esc).join(' / ')}<br>${esc(x.defaults[1])} sets · ${esc(x.defaults[2])} reps · ${esc(x.defaults[4])} rest</div>${motionPreview(x)}<a class="video-link" target="_blank" rel="noopener" href="${x.videoSearch}">Short video / form search</a><div class="actions"><button class="primary" onclick="chooseSub('${encodeURIComponent(x.name)}',false)">Use This Workout</button><button class="ghost" onclick="chooseSub('${encodeURIComponent(x.name)}',true)">Make Program Default</button></div></div>`).join(''):'<p class="meta">No alternatives match this location filter yet.</p>'}
function setSubFilter(f){subFilter=f;renderSubList()}
async function chooseSub(encoded,permanent){let name=decodeURIComponent(encoded),old=effectiveWorkout()[subIndex]?.[0],s=currentSession(),hasLogs=s&&logs.some(l=>l.sessionId===s.id&&l.exercise===old);if(hasLogs&&!confirm(`You already logged sets for ${old}. Existing logs will stay under that exercise name. Continue?`))return;await applyExerciseChange(subIndex,EXLIB[name].defaults,permanent);if(!permanent){let ses=currentSession(),line=`Substitution: ${old} → ${name}.`;if(ses&&!String(ses.notes||'').includes(line)){ses.notes=((ses.notes||'').trim()+'\n'+line).trim();await put('sessions',ses);let si=sessions.findIndex(x=>x.id===ses.id);if(si>=0)sessions[si]=ses;loadNotes()}}$('subModal').classList.remove('show')}
function duplicateWorkout(){let src=active,name=prompt('Name duplicated workout:',src+' Copy');if(!name)return;name=name.trim();if(!name||currentProgram().workouts[name])return alert('Choose a unique workout name.');currentProgram().workouts[name]=clone(baseWorkout());savePrograms();active=name;refreshWorkoutSelect();render()}
function restoreWorkoutDefaults(){let def=activeProgram==='Lean Mass Builder'?LEAN_MASS_DEFAULT[active]:activeProgram==='Shortcut to Size'?SHORTCUT_TO_SIZE_WORKOUTS[active]:null;if(!def)return alert('No built-in default is available for this workout.');if(!confirm('Restore this workout to the original program version?'))return;currentProgram().workouts[active]=clone(def);savePrograms();render()}
function info(i){let ex=effectiveWorkout()[i],n=ex[0],lib=EXLIB[n]||{group:'Other',environments:['Gym'],setup:[],mistakes:[],tips:[],videoSearch:'#',motion:'press'};$('mTitle').textContent=n;$('mMeta').textContent=`${lib.group} · ${ex[1]} sets · ${ex[2]} reps · ${ex[4]} rest · ${lib.environments.join(' / ')}`;$('mVideo').innerHTML=motionPreview(lib)+`<a class="video-link" target="_blank" rel="noopener" href="${lib.videoSearch}">Find a concise form video (target: under 3 minutes)</a>`;$('mDetails').innerHTML=`<div class="grid2"><div><h3>Setup / Performance</h3><ul>${lib.setup.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div><h3>Common Mistakes</h3><ul>${lib.mistakes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div><h3>Tips</h3><ul>${lib.tips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;let last=lastSets(n);$('mLast').textContent=last.length?`Last ${active}: ${last.map(s=>`${s.weight}×${s.reps}`).join(', ')}`:`No prior ${active} sets for this exercise.`;$('modal').classList.add('show')}
function startTimer(rest){cancelTimer();let seconds=parseInt(rest,10)||45;timerEnd=Date.now()+seconds*1000;$('timer').classList.add('show');updateTimer();timerId=setInterval(updateTimer,250)}
function updateTimer(){let r=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));$('timerText').textContent=`Rest: ${r}s`;if(r<=0){cancelTimer();try{navigator.vibrate?.([200,80,200])}catch{};$('timerText').textContent='Rest complete';$('timer').classList.add('show');setTimeout(()=>$('timer').classList.remove('show'),2200)}}
function cancelTimer(){if(timerId)clearInterval(timerId);timerId=null;$('timer').classList.remove('show')}
function sessionDurationMinutes(s){let ls=logs.filter(l=>l.sessionId===s.id).sort((a,b)=>a.ts.localeCompare(b.ts));if(!ls.length)return 0;let start=new Date(ls[0].ts),end=new Date(s.end||ls[ls.length-1].ts),min=Math.max(0,Math.round((end-start)/60000));if(min>12*60){let last=new Date(ls[ls.length-1].ts);min=Math.max(0,Math.round((last-start)/60000));}return min}
function durationText(s){let min=sessionDurationMinutes(s);if(min<1)return'<1 min';let h=Math.floor(min/60),m=min%60;return h?`${h}h ${m}m`:`${m} min`}
async function completeWorkout(){await flushPendingSaves();await flushNoteSave();let s=await ensureSession(),ls=logs.filter(l=>l.sessionId===s.id);if(!ls.length&&!confirm('No sets are logged. Complete this workout anyway?'))return;s={...s,end:new Date().toISOString(),completed:true,updatedAt:new Date().toISOString()};await put('sessions',s);let si=sessions.findIndex(x=>x.id===s.id);if(si>=0)sessions[si]=s;let vol=ls.reduce((a,l)=>a+(+l.weight||0)*(+l.reps||0),0),ex=new Set(ls.map(l=>l.exercise));$('completeSummary').innerHTML=`<div class="completeBox"><div class="stats"><div class="stat"><span class="small">Duration</span><b>${durationText(s)}</b></div><div class="stat"><span class="small">Sets</span><b>${ls.length}</b></div><div class="stat"><span class="small">Volume</span><b>${Math.round(vol)}</b></div></div><p>${esc(active)} complete. ${ex.size} exercises logged.</p>${s.notes?`<p class="meta">Notes: ${esc(s.notes)}</p>`:''}</div>`;$('completeModal').classList.add('show');currentSessionId=null;localStorage.removeItem('currentSessionId');$('workoutNotes').value='';await load();render()}
function renderSessionStrip(){let s=currentSession(),ls=s?logs.filter(l=>l.sessionId===s.id):[];$('sessionStrip').textContent=sessionMatches(s)?`In progress · ${ls.length} saved sets${s.notes?' · notes saved':''}`:'No active workout session'}
function sessionSummaries(){return sessions.map(s=>{let ls=logs.filter(l=>l.sessionId===s.id),ex=new Set(ls.map(l=>l.exercise));return{id:s.id,date:s.date,program:s.program||'Lean Mass Builder',workout:s.workout,sets:ls.length,volume:ls.reduce((a,l)=>a+(+l.weight||0)*(+l.reps||0),0),exCount:ex.size,session:s}}).filter(x=>x.sets||x.session.completed).sort((a,b)=>(b.session.end||b.session.updatedAt||b.session.start||'').localeCompare(a.session.end||a.session.updatedAt||a.session.start||''))}
function renderDashboard(){if(!$('dashboard'))return;let allS=sessionSummaries(),completed=allS.filter(x=>x.session.completed),now=new Date(),monthStart=new Date(now.getFullYear(),now.getMonth(),1),todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()),cutoff=new Date(todayStart);cutoff.setDate(cutoff.getDate()-29);let thisMonth=completed.filter(x=>{let d=new Date(x.date+'T00:00:00');return d>=monthStart&&d<=now}).length,days30=completed.filter(x=>{let d=new Date(x.date+'T00:00:00');return d>=cutoff&&d<=now}).length,last=completed[0],cal=calendarHtml(now),prs=personalRecords().slice(0,5);$('dashboard').innerHTML=`<section class="install"><b>Device-only storage:</b> Titan saves sets, notes, substitutions and program changes locally. Export backups before clearing browser data or changing devices.</section><section class="card"><h2>Dashboard</h2><div class="stats"><div class="stat"><span class="small">Completed</span><b>${completed.length}</b></div><div class="stat"><span class="small">Last 30 days</span><b>${days30}</b></div><div class="stat"><span class="small">This month</span><b>${thisMonth}</b></div></div><p class="meta" style="margin-top:12px">Last completed: ${last?`${esc(last.date)} — ${esc(last.program)} / ${esc(last.workout)} · ${durationText(last.session)}`:'none yet'}</p><button class="primary" style="width:100%;margin-top:10px" onclick="showView('train')">Start / Log Workout</button></section><section class="card"><h2>Workout Calendar</h2>${cal}</section><section class="card"><h2>Top Personal Records</h2>${prs.length?prs.map(p=>`<div class="history"><b>${esc(p.exercise)}</b><br>Best weight: ${p.maxWeight} · Best volume set: ${p.maxVolume}</div>`).join(''):'No records yet.'}</section><section class="card"><h2>Completed Workout History</h2>${completed.slice(0,12).map(x=>`<div class="history"><b>${esc(x.date)}</b> · ${esc(x.program)} / ${esc(x.workout)}<br>${x.sets} sets · ${Math.round(x.volume)} lb volume · ${x.exCount} exercises · ${durationText(x.session)}${x.session.notes?`<br><span class="small">${esc(x.session.notes)}</span>`:''}</div>`).join('')||'No completed workouts yet.'}</section>`}
function calendarHtml(d){let y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),ss=sessionSummaries().filter(x=>x.session.completed),done=new Set(ss.map(x=>x.date)),html='<div class="calendar">';['S','M','T','W','T','F','S'].forEach(x=>html+='<div class="dow">'+x+'</div>');for(let i=0;i<first.getDay();i++)html+='<div></div>';for(let day=1;day<=last.getDate();day++){let iso=localDate(new Date(y,m,day)),cls='day '+(done.has(iso)?'doneDay ':'')+(iso===localDate()?'today':'');html+=`<div class="${cls}"><b>${day}</b></div>`}return html+'</div>'}
function personalRecords(){let by={};logs.forEach(l=>{let w=+l.weight||0,r=+l.reps||0,v=w*r;if(!by[l.exercise])by[l.exercise]={exercise:l.exercise,maxWeight:0,maxVolume:0};by[l.exercise].maxWeight=Math.max(by[l.exercise].maxWeight,w);by[l.exercise].maxVolume=Math.max(by[l.exercise].maxVolume,v)});return Object.values(by).sort((a,b)=>b.maxVolume-a.maxVolume)}
function renderLibrary(){let groups=[...new Set(Object.values(EXLIB).map(x=>x.group))].sort(),programCards=Object.values(PROGRAMS).map(p=>`<div class="program-card"><b>${esc(p.name)}</b><div class="meta">${esc(p.description||'')}</div>${p.schedule?`<div class="small" style="margin-top:6px">${esc(p.schedule)}</div>`:''}${p.source?`<a class="video-link" target="_blank" rel="noopener" href="${p.source}">Program source / overview</a>`:''}</div>`).join('');$('libraryView').innerHTML=`<section class="card"><h2>Program Library</h2><p class="meta">Programs live here and are selectable from the Train tab.</p>${programCards}</section><section class="card"><h2>Exercise Library</h2><p class="meta">Browse by primary muscle focus. Location tags make it easier to find a gym, hotel, or bodyweight alternative.</p>${groups.map(g=>`<details class="muscleGroup"><summary>${esc(g)} · ${Object.values(EXLIB).filter(x=>x.group===g).length} exercises</summary>${Object.values(EXLIB).filter(x=>x.group===g).sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<div class="exerciseChoice"><b>${esc(x.name)}</b><div class="locationTags">${x.environments.map(e=>`<span class="tag">${esc(e)}</span>`).join('')}</div><a class="video-link" target="_blank" rel="noopener" href="${x.videoSearch}">Short video / form search</a></div>`).join('')}</details>`).join('')}</section>`}
function backupObject(){return{app:'Titan Workout Tracker',version:BACKUP_VERSION,exportedAt:new Date().toISOString(),sets:logs,sessions,programs:PROGRAMS,activeProgram}}
function renderData(){$('dataView').innerHTML=`<section class="card"><h2>Data / Backup</h2><p class="meta">Stored on this device in IndexedDB/local storage. Export before changing phones or clearing site data.</p><div class="actions"><button class="primary" onclick="exportBackup()">Export Backup JSON</button><label class="ghost" style="border:1px solid var(--line);padding:12px 14px;border-radius:12px;text-align:center;cursor:pointer">Import Backup<input type="file" accept="application/json,.json" onchange="importBackup(event)" style="display:none"></label></div><h3>Import behaviour</h3><select id="importMode"><option value="replace">Replace all current Titan data</option><option value="merge">Merge without duplicates</option></select><h3>Current Data Preview</h3><textarea readonly>${esc(JSON.stringify(backupObject(),null,2).slice(0,1800))}</textarea></section>`}
function exportBackup(){let blob=new Blob([JSON.stringify(backupObject(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`titan-workout-v63-backup-${localDate()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function dedupeKey(l){return `${l.sessionId}|${l.exercise}|${l.set}`}
function importBackup(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=async()=>{try{let data=JSON.parse(reader.result);if(!Array.isArray(data.sets)||!Array.isArray(data.sessions))throw Error('Backup is missing sets or sessions.');let mode=$('importMode')?.value||'replace';if(!confirm(mode==='replace'?'Replace all current Titan workout data?':'Merge this backup with current data?'))return;if(mode==='replace'){await clearStore('sets');await clearStore('sessions')}let es=new Map((await all('sessions')).map(s=>[s.id,s])),el=new Map((await all('sets')).map(l=>[dedupeKey(l),l]));for(let s of data.sessions)if(!es.has(s.id)||mode==='replace')await put('sessions',s);for(let l of data.sets){let k=dedupeKey(l);if(!el.has(k)||mode==='replace')await put('sets',{...l,id:l.id||uid()})}if(data.programs)PROGRAMS=clone(data.programs);else if(data.program){PROGRAMS=clone(DEFAULT_PROGRAMS);PROGRAMS['Lean Mass Builder'].workouts=clone(data.program)}savePrograms('Imported program data saved');activeProgram=data.activeProgram&&PROGRAMS[data.activeProgram]?data.activeProgram:'Lean Mass Builder';localStorage.setItem('activeProgram',activeProgram);currentSessionId=null;localStorage.removeItem('currentSessionId');await load();refreshProgramSelect();render();renderData();alert('Backup imported successfully.')}catch(err){alert('Import failed: '+err.message)}finally{e.target.value=''}};reader.readAsText(f)}
init();
